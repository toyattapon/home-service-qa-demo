services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: home_service_qa
      POSTGRES_USER: home_service
      POSTGRES_PASSWORD: home_service
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U home_service -d home_service_qa",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - home-service-postgres:/var/lib/postgresql/data

volumes:
  home-service-postgres:
